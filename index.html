<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tanmay Zile — Java & Full Stack Developer</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F5F3;--card:#FFFFFF;--ink:#0A0A0A;--mute:#5E5E5E;--line:#E6E4E0;--cb:#F25512;--cbd:#B03C06;--sky:#FFE1D0;--lem:#FFB98F;
--f:'Manrope','Segoe UI',system-ui,sans-serif;
--raise:0 1px 0 #fff inset,0 2px 4px rgba(10,10,10,.04),0 14px 26px -10px rgba(10,10,10,.14),0 40px 60px -34px rgba(242,85,18,.28);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:96px;overflow-x:clip}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 var(--f)}
h1,h2,h3,p{margin:0}
a{color:inherit}
.w{max-width:1120px;margin:0 auto;padding:0 24px}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--cb);outline-offset:3px}
header{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));z-index:20;padding:0 16px}
.bar{max-width:1120px;margin:12px auto 0;height:60px;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);border-radius:18px;box-shadow:var(--raise);display:flex;align-items:center;padding:0 12px 0 10px;gap:4px}
.lg{width:40px;height:40px;border-radius:12px;background:var(--cb);color:#fff;font-weight:800;display:grid;place-items:center;text-decoration:none;box-shadow:0 3px 0 var(--cbd);margin-right:auto}
.bar a.n{padding:8px 14px;border-radius:10px;text-decoration:none;font-weight:500;font-size:15px;color:var(--mute)}
.bar a.n.on{color:var(--ink);background:var(--bg)}
.btn{display:inline-block;border:0;border-radius:14px;background:var(--cb);color:#fff;font:700 16px var(--f);padding:14px 26px;text-decoration:none;cursor:pointer;box-shadow:0 5px 0 var(--cbd),0 18px 24px -10px rgba(242,85,18,.5);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(2px);box-shadow:0 3px 0 var(--cbd),0 10px 16px -8px rgba(242,85,18,.5)}
.btn:active{transform:translateY(5px);box-shadow:0 0 0 var(--cbd)}
.btn.g{background:#fff;color:var(--ink);box-shadow:var(--raise),0 4px 0 var(--line)}
.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:32px;align-items:center;padding:56px 0 70px}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--lem);padding:6px 14px;border-radius:99px;font-weight:700;font-size:14px;margin-bottom:22px}
.pill:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink)}
h1{font-size:clamp(46px,7vw,92px);font-weight:800;letter-spacing:-.045em;line-height:.98}
h1 em{font-style:normal;color:var(--cb)}
.lead{color:var(--mute);max-width:46ch;margin:22px 0 30px;font-size:18px}
.scene{perspective:1100px;height:500px;display:grid;place-items:center}
.tilt{transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transform-style:preserve-3d;transition:transform .2s ease-out;will-change:transform}
.hc{position:relative;width:310px;height:420px;background:#fff;border-radius:28px;box-shadow:var(--raise),0 60px 70px -30px rgba(242,85,18,.35);padding:14px}
.hc img{width:100%;height:332px;object-fit:cover;object-position:50% 15%;border-radius:18px;display:block;border:2px solid var(--ink);background:var(--sky)}
.hc .nm{position:absolute;left:24px;right:24px;bottom:18px;transform:translateZ(36px)}
.hc .nm b{display:block;font-size:19px}.hc .nm span{font-size:14px;color:var(--mute)}
.fl{position:absolute;background:#fff;border-radius:14px;padding:9px 16px;font-weight:700;font-size:14px;box-shadow:var(--raise);white-space:nowrap}
.fl.a{left:-64px;top:44px;transform:translateZ(90px);background:var(--lem)}
.fl.b{right:-100px;top:150px;transform:translateZ(120px);background:var(--cb);color:#fff}
.fl.c{left:-72px;top:250px;transform:translateZ(70px)}
.fl.d{right:-68px;top:300px;transform:translateZ(100px);background:var(--sky)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:-10px}
.stat{background:var(--card);border-radius:20px;padding:22px 26px;box-shadow:var(--raise)}
.stat b{display:block;font-size:46px;font-weight:800;letter-spacing:-.04em;color:var(--cb);line-height:1.1}
.stat span{color:var(--mute);font-size:15px}
section{padding:96px 0 0}
h2{font-size:clamp(34px,5vw,56px);font-weight:800;letter-spacing:-.04em;line-height:1.02;margin-bottom:12px}
.sub{color:var(--mute);max-width:56ch;margin-bottom:38px}
.abt{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.abt p{color:var(--mute)}
.abt p:first-child{color:var(--ink);font-size:21px;font-weight:500;line-height:1.5}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.pan{background:var(--card);border-radius:22px;padding:24px;box-shadow:var(--raise)}
.pan h3{font-size:19px;font-weight:700;margin-bottom:14px;transform:translateZ(30px)}
.ch{display:flex;flex-wrap:wrap;gap:8px;transform:translateZ(18px)}
.ch span{background:var(--bg);border-radius:10px;padding:5px 12px;font-size:14.5px;font-weight:500}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.pc{background:var(--card);border-radius:24px;padding:28px;box-shadow:var(--raise);display:flex;flex-direction:column;gap:12px}
.pc>*{transform:translateZ(20px)}
.pc h3{font-size:26px;font-weight:800;letter-spacing:-.03em}
.pc p{color:var(--mute);font-size:16px}
.yr{font-size:13px;font-weight:700;background:var(--lem);align-self:flex-start;padding:3px 12px;border-radius:99px}
.tg{display:flex;flex-wrap:wrap;gap:8px}.tg span{border:1.5px solid var(--line);border-radius:99px;padding:2px 12px;font-size:13.5px;font-weight:500}
.pc ul{margin:0;padding-left:20px;color:var(--mute);font-size:15.5px}
.mo{align-self:flex-start;background:none;border:0;padding:0;color:var(--cb);font:700 15px var(--f);cursor:pointer;margin-top:auto}
.pc.ft{grid-column:1/-1;flex-direction:row;gap:30px;align-items:center;background:linear-gradient(135deg,#fff 55%,#FFE9DD)}
.pc.ft .tx{flex:1;display:flex;flex-direction:column;gap:12px}
.isow{perspective:900px;width:300px;height:260px;flex:none;display:grid;place-items:center}
.iso{position:relative;width:170px;height:170px;transform:rotateX(58deg) rotateZ(-38deg);transform-style:preserve-3d}
.pl{position:absolute;inset:0;border-radius:20px;display:flex;align-items:flex-end;justify-content:flex-end;padding:12px 16px;font-weight:800;font-size:15px;box-shadow:0 14px 24px rgba(10,10,10,.18);transform:translateZ(calc(var(--i)*30px));transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.ft:hover .pl,.ft:focus-within .pl{transform:translateZ(calc(var(--i)*58px))}
.cl{background:var(--card);border-radius:24px;box-shadow:var(--raise);padding:8px 28px}
.cl li{list-style:none;display:grid;grid-template-columns:96px 1fr;gap:18px;padding:18px 0;border-top:1px solid var(--line)}
.cl li:first-child{border:0}
.cl time{font-weight:800;color:var(--cb)}
.cl small{display:block;color:var(--mute);font-size:15px}
ul.cl{margin:0}
.ct{display:grid;grid-template-columns:1fr 1.1fr;gap:34px;background:var(--ink);color:#fff;border-radius:30px;padding:clamp(26px,5vw,56px);box-shadow:0 40px 60px -30px rgba(10,10,10,.5)}
.ct p{color:#B5B5B5}
.ct h2{color:#fff}
.ct a.m{display:inline-block;margin-top:18px;color:var(--lem);font-weight:700;font-size:20px;word-break:break-all}
form{display:grid;gap:12px}
input,textarea{width:100%;border:0;border-radius:14px;padding:14px 16px;font:inherit;background:#1F1F1F;color:#fff}
input::placeholder,textarea::placeholder{color:#8C8C8C}
.err{color:#FFB4A8;font-size:15px}
.ct .btn{background:var(--lem);color:var(--ink);box-shadow:0 5px 0 #D98A5C;justify-self:start}
footer{padding:48px 0;color:var(--mute);font-size:15px}
.prog{position:fixed;left:0;top:0;height:3px;width:calc(var(--p,0)*100%);background:var(--cb);z-index:40}
.pc,.pan{position:relative}
.pc:after,.pan:after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),rgba(242,85,18,.11),transparent 65%);opacity:0;transition:opacity .25s;pointer-events:none}
.pc:hover:after,.pan:hover:after{opacity:1}
.g3,.pg,.stats{perspective:1400px}
.rv{opacity:0;translate:0 50px;rotate:x 22deg;transition:opacity .7s,translate .8s cubic-bezier(.2,.8,.2,1),rotate .8s cubic-bezier(.2,.8,.2,1)}
.tilt.rv{transition:transform .2s ease-out,opacity .7s,translate .8s cubic-bezier(.2,.8,.2,1),rotate .8s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;translate:0 0;rotate:x 0deg}
.rv:nth-child(3n+2){transition-delay:.09s}.rv:nth-child(3n){transition-delay:.18s}
.scene{translate:0 calc(var(--sy,0)*-.1px)}
.fl{animation:bob 5s ease-in-out infinite}.fl.b{animation-duration:6.4s;animation-delay:-2s}.fl.c{animation-duration:5.6s;animation-delay:-3s}.fl.d{animation-duration:7s;animation-delay:-1s}
@keyframes bob{50%{translate:0 -12px}}
.cw{position:absolute;right:-30px;top:-70px;width:76px;height:76px;transform:translateZ(80px);transform-style:preserve-3d}
.cube{width:100%;height:100%;transform-style:preserve-3d;transform:rotateX(-24deg) rotateY(0);animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotateX(336deg) rotateY(360deg)}}
.cube i{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:15px;color:var(--cb);background:rgba(255,225,208,.78);border:1.5px solid var(--cb);border-radius:10px}
.cube .f0{transform:translateZ(38px)}.cube .f1{transform:rotateY(180deg) translateZ(38px)}.cube .f2{transform:rotateY(90deg) translateZ(38px)}.cube .f3{transform:rotateY(-90deg) translateZ(38px)}.cube .f4{transform:rotateX(90deg) translateZ(38px)}.cube .f5{transform:rotateX(-90deg) translateZ(38px)}
.iso{animation:isow 9s ease-in-out infinite alternate}
@keyframes isow{from{transform:rotateX(58deg) rotateZ(-38deg)}to{transform:rotateX(58deg) rotateZ(-14deg)}}
.lg{background:var(--ink);box-shadow:0 3px 0 var(--cb)}
.pill{background:var(--ink);color:#fff}.pill:before{background:var(--cb)}
.stat:nth-child(2){background:var(--ink);color:#fff}.stat:nth-child(2) span{color:#BDBDBD}.stat:nth-child(2) b{color:var(--lem)}
.fl.c{background:var(--ink);color:#fff}
.btn.g{box-shadow:var(--raise),0 4px 0 var(--ink)}
@media(max-width:860px){.hero,.abt,.ct,.pg{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}.scene{height:480px}.bar a.n{display:none}.pc.ft{flex-direction:column;align-items:flex-start}.stats{grid-template-columns:1fr 1fr 1fr;gap:10px}.stat{padding:16px}.stat b{font-size:32px}.cw{right:0;top:-60px}.fl.a,.fl.b,.fl.c{display:none}.fl.d{right:18px;top:372px}}
@media(max-width:560px){.g3{grid-template-columns:1fr}.cl li{grid-template-columns:70px 1fr}}
@media(prefers-reduced-motion:reduce){.cube,.iso,.fl{animation:none!important}.rv{opacity:1;translate:none;rotate:none}html{scroll-behavior:auto}.tilt{transform:none!important}*{transition:none!important}}
</style>
</head>

}
function useSpy(){
 const [on,setOn]=useState("");
 useEffect(()=>{const io=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&setOn(e.target.id)),{rootMargin:"-40% 0px -55% 0px"});
  NAV.forEach(i=>{const el=document.getElementById(i);el&&io.observe(el)});return()=>io.disconnect()},[]);
 return on;
}
function Card({p}){
 const [o,setO]=useState(false);
 return html`<${Tilt} className="pc rv" max=${5}><span class="yr">${p.y}</span><h3>${p.t}</h3><p>${p.d}</p>
 <div class="tg">${p.tech.map(x=>html`<span key=${x}>${x}</span>`)}</div>
 ${o&&html`<ul>${p.pts.map(x=>html`<li key=${x}>${x}</li>`)}</ul>`}
 <button class="mo" aria-expanded=${o} onClick=${()=>setO(!o)}>${o?"Hide details":"View details"}</button><//>`;
}
function Featured({p}){
 const [o,setO]=useState(false);
 const pl=[["GitHub","#FFE1D0"],["Jenkins","#fff"],["Docker","#FFB98F"],["AWS","#F25512"]];
 return html`<div class="pc ft rv"><div class="tx"><span class="yr">${p.y}</span><h3 style=${{fontSize:34}}>${p.t}</h3><p>${p.d}</p>
  <div class="tg">${p.tech.map(x=>html`<span key=${x}>${x}</span>`)}</div>
  ${o&&html`<ul>${p.pts.map(x=>html`<li key=${x}>${x}</li>`)}</ul>`}
  <button class="mo" style=${{marginTop:4}} aria-expanded=${o} onClick=${()=>setO(!o)}>${o?"Hide details":"View details"}</button></div>
  <div class="isow" aria-hidden="true"><div class="iso">${pl.map(([n,c],i)=>html`<div class="pl" key=${n} style=${{"--i":i,background:c,color:i===3?"#fff":"#0A0A0A"}}>${n}</div>`)}</div></div></div>`;
}
function Contact(){
 const [m,setM]=useState({n:"",e:"",t:""}),[err,setErr]=useState("");
 const up=k=>e=>setM({...m,[k]:e.target.value});
 const go=ev=>{ev.preventDefault();
  if(!m.n.trim()||!/^\S+@\S+\.\S+$/.test(m.e)||m.t.trim().length<10){setErr("Add your name, a valid email and a message of 10+ characters.");return}
  setErr("");location.href="mailto:"+D.email+"?subject="+encodeURIComponent("Hello from "+m.n)+"&body="+encodeURIComponent(m.t+"\n\n"+m.n+" · "+m.e)};
 return html`<div class="ct rv"><div><h2>Let's work together.</h2><p>I'm open to Software Engineering and Full Stack internships. Send a note and I'll reply.</p>
  <a class="m" href=${"mailto:"+D.email}>${D.email}</a><p style=${{marginTop:8}}>${D.phone}</p></div>
  <form onSubmit=${go} noValidate><input aria-label="Name" placeholder="Your name" value=${m.n} onInput=${up("n")}/><input aria-label="Email" type="email" placeholder="Your email" value=${m.e} onInput=${up("e")}/>
  <textarea aria-label="Message" rows="4" placeholder="Your message" value=${m.t} onInput=${up("t")}></textarea>
  ${err&&html`<p class="err" role="alert">${err}</p>`}<button class="btn" type="submit">Send email</button></form></div>`;
}
function App(){
 const on=useSpy();
 useEffect(()=>{
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});
  document.querySelectorAll(".rv").forEach(el=>io.observe(el));
  const sc=()=>{const d=document.documentElement;d.style.setProperty("--sy",scrollY);d.style.setProperty("--p",scrollY/Math.max(1,d.scrollHeight-innerHeight))};
  sc();addEventListener("scroll",sc,{passive:true});return()=>{io.disconnect();removeEventListener("scroll",sc)}},[]);
 const S=(id,t,sub,body)=>html`<section id=${id}><div class="w"><h2>${t}</h2><p class="sub">${sub}</p>${body}</div></section>`;
 return html`<div><div class="prog" aria-hidden="true"></div>
 <header><div class="bar"><a class="lg" href="#top" aria-label="Top">TZ</a>
  ${NAV.map(n=>html`<a key=${n} class=${"n"+(on===n?" on":"")} href=${"#"+n}>${n[0].toUpperCase()+n.slice(1)}</a>`)}
  <a class="btn" style=${{padding:"9px 18px",fontSize:14,marginLeft:8}} href="#contact">Hire me</a></div></header>
 <main id="top"><div class="w"><div class="hero"><div>
  <span class="pill">Open to internships</span>
  <h1>Tanmay <em>Zile</em>, Java & full stack developer.</h1><p class="lead">${D.intro}</p>
  <a class="btn" href="#projects">View projects</a> <a class="btn g" style=${{marginLeft:10}} href="#contact">Contact</a></div>
  <div class="scene"><${Tilt} max=${24} g=${true}><div class="hc"><img src=${AVATAR} alt="Portrait of Tanmay Zile"/><div class="nm"><b>Tanmay Zile</b><span>B.Tech CSE · 2027</span></div>
   <div class="cw" aria-hidden="true"><div class="cube">${["Java","SQL","Git","AWS","Python","C"].map((f,i)=>html`<i key=${f} class=${"f"+i}>${f}</i>`)}</div></div><span class="fl a">Java</span><span class="fl b">Spring Boot</span><span class="fl c">MySQL</span><span class="fl d">Docker</span></div><//></div></div>
  <div class="stats">${D.stats.map(([n,l])=>html`<div class="stat rv" key=${l}><b><${Count} to=${n}/></b><span>${l}</span></div>`)}</div></div>
 ${S("about","About","Who I am and what I'm aiming for.",html`<div class="abt">${D.about.map(a=>html`<p key=${a}>${a}</p>`)}</div>`)}
 ${S("skills","Skills","What I use to build things.",html`<div class="g3">${Object.entries(D.skills).map(([c,l])=>html`<${Tilt} className="pan rv" max=${6} key=${c}><h3>${c}</h3><div class="ch">${l.map(s=>html`<span key=${s}>${s}</span>`)}</div><//>`)}</div>`)}
 ${S("projects","Projects","Hover a card, then open it for details.",html`<div class="pg"><${Featured} p=${D.build}/>${D.projects.map(p=>html`<${Card} key=${p.t} p=${p}/>`)}</div>`)}
 ${S("certificates","Certificates","Newest first.",html`<ul class="cl rv">${D.certs.map(([y,t,d])=>html`<li key=${t}><time>${y}</time><div><b>${t}</b><small>${d}</small></div></li>`)}</ul>`)}
 ${S("contact","","",html`<${Contact}/>`)}
 <footer class="w">© ${new Date().getFullYear()} Tanmay Zile</footer></main></div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
